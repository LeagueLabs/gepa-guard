[project]
name = "gepa-guard"
version = "0.1.0"
description = "Non-regression acceptance for GEPA reflective prompt optimization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Mia Ojeda", email = "eojeda@league.com"},
    {name = "League Inc.", email = "open-source-devs@league.com"},
]
maintainers = [
    {name = "Mia Ojeda", email = "eojeda@league.com"},
    {name = "League Inc.", email = "open-source-devs@league.com"},
]
requires-python = ">=3.11,<3.16"
dependencies = ["gepa>=0.1.4"]
keywords = ["gepa", "prompt optimization", "llm", "safety", "non-regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "--cov=gepa_guard",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D", "PT", "N"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
